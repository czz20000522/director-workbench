name: Public source boundaries
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check reviewed source paths and sensitive patterns
        run: python3 ComfyUI-Workspace/projects/director-workbench/tools/export_public_source.py --check
      - name: Check public syntax and document links
        run: python3 ComfyUI-Workspace/projects/director-workbench/tools/check_public_docs.py
