# Deterministic test impact mapping for tools/select_tests.py.
#
# Every changed path is classified by these rules (first match wins):
#   shared paths -> full core suite; docs -> public-source/doc gates; test files ->
#   themselves; [[mapping]] -> its pytest/browser targets; Python sources -> reverse
#   imports; frontend/frontend_shared -> browser drivers; anything else -> fail-closed.
#
# Mapping targets are validated by `python tools/select_tests.py --check-config`;
# delete or rename a test and the matching entry must move in the same change.
schema_version = 1
# Change set is diffed against this ref unless --base overrides it.
default_base = "origin/main"

# Shared contracts: schemas, route aggregation, auth/storage/task entry points,
# dependency manifests, CI/release, public entry points, and test infrastructure.
# Any of these escalates to the full core suite because a per-feature answer would
# not be trustworthy.
[shared]
paths = [
  "backend/__init__.py",
  "backend/app.py",
  "backend/schemas.py",
  "backend/routers/__init__.py",
  "backend/routers/task_entry.py",
  "backend/private_app.py",
  "backend/private_auth.py",
  "backend/private_deletion.py",
  "backend/private_mode.py",
  "backend/private_sessions.py",
  "backend/private_workspaces.py",
  "backend/storage.py",
  "backend/task_scheduler.py",
  "backend/task_store.py",
  "backend/user_context.py",
  "backend/workbench_config.py",
  "mcp_server/models.py",
  "mcp_server/server.py",
  "paths.py",
  "production/storage_layout.py",
  "contracts/**",
  "requirements.txt",
  "requirements-dev.txt",
  "requirements-mcp.txt",
  "requirements-audio-tests.txt",
  "pyproject.toml",
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  "vite.config.ts",
  ".github/**",
  ".gitignore",
  "run_tests.ps1",
  "tools/export_public_source.py",
  "tools/check_public_docs.py",
  "tools/run_project_tests.py",
  "tools/select_tests.py",
  "tools/test_impact.toml",
  "tests/conftest.py",
  "tests/support.py",
  "tests/runtime_scratch.py",
]

# Documentation-only changes run the public source boundary test and the same
# syntax/link gates the public-source CI job uses.  Both are cheap and local.
[docs]
paths = [
  "*.md",
  "docs/**",
  "mcp_server/README.md",
  ".agents/**",
]
tests = ["tests/test_public_source.py"]
gates = [
  { name = "public-source-export", argv = ["python", "tools/export_public_source.py", "--check"] },
  { name = "public-docs", argv = ["python", "tools/check_public_docs.py"] },
]

# UI paths.  A frontend path with a [[mapping]] entry selects only its drivers;
# an unmapped UI path is fail-closed to every driver rather than silently skipped.
[frontend]
paths = [
  "src/**",
  "index.html",
  "prototype.html",
  "public/**",
]
# Cross-panel shell and utilities: every driver bundles them, so every driver runs.
shared_paths = [
  "src/App.tsx",
  "src/main.tsx",
  "src/styles.css",
  "src/app/**",
  "src/api/**",
  "src/data.ts",
  "src/sessionFetch.ts",
]

# The local fast layer: pure unit/contract tests, no service, media or browser.
# `run_tests.ps1 -Suite fast` runs exactly this list; the budget is checked by the
# runner and a slower layer must not be added silently.
[fast]
budget_seconds = 60
tests = [
  "tests/test_test_impact.py",
  "tests/test_project_test_runner.py",
  "tests/test_secure_files.py",
  "tests/test_atomic_files.py",
  "tests/test_optimization_atomic_json.py",
  "tests/test_paths.py",
  "tests/test_user_context.py",
  "tests/test_storage_layout.py",
  "tests/test_runtime_scratch.py",
  "tests/test_review_openapi.py",
  "tests/test_static_ui.py",
  "tests/test_public_source.py",
  "tests/test_model_catalog.py",
  "tests/test_recovery_plan.py",
  "tests/test_audio_normalization.py",
  "tests/test_delivery_upscale.py",
  "tests/test_shot_refinement.py",
  "tests/test_backend_module_split.py",
]

# ---------------------------------------------------------------------------
